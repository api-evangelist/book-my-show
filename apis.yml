description: 'BookMyShow (Bigtree Entertainment Pvt. Ltd.) is India''s premier online
  entertainment ticketing platform, serving as a centralized hub for discovering and
  booking movies, live music festivals, comedy, theatre, sports, activities, and Video-on-Demand
  (VOD) streaming. For enterprise partners and event organizers it also provides venue
  management software, box-office point-of-sale solutions, corporate vouchers, gift
  cards, and end-to-end event production capabilities. Added to the API Evangelist
  network as a portfolio company of Accel; enriched by the enrichment pipeline. No
  public developer API or portal was found, but BookMyShow publishes an agent-facing
  llms.txt describing its consumer inventory hubs and B2B services.'
